name: Adoption
description: Say you are using Dataforge. A name and a link are enough.
title: "Using Dataforge: "
body:
  - type: markdown
    attributes:
      value: |
        This is how anonymous use becomes a name. A maintainer can add your
        reply to ADOPTERS.md. The support-desk project in this repository is
        a demo, not an adopter.
  - type: input
    id: who
    attributes:
      label: Who
      description: Your name or organization, and a link.
      placeholder: Acme — https://example.com
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How you use it
      description: One sentence is enough. Say what you build and which engine you run.
    validations:
      required: true
